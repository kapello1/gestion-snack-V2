# Config Nginx (hote, pas de conteneur) - a copier vers
# /etc/nginx/sites-available/gestion-snack puis lier dans sites-enabled.
# Remplacer "votre-domaine.com" par le vrai domaine avant de l'activer.
# Apres activation, lancer : sudo certbot --nginx -d votre-domaine.com -d www.votre-domaine.com
# Certbot reecrira ce fichier pour ajouter le bloc HTTPS (443) automatiquement.

server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.com www.votre-domaine.com;

    root /var/www/gestion-snack/frontend;
    index index.html;

    client_max_body_size 20M;

    # API REST du backend Spring Boot
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket STOMP (notifications temps reel)
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /ws-sockjs {
        proxy_pass http://127.0.0.1:8080/ws-sockjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Swagger / OpenAPI (optionnel, utile pour verifier que le backend tourne)
    location /api-docs {
        proxy_pass http://127.0.0.1:8080/api-docs;
    }
    location /swagger-ui.html {
        proxy_pass http://127.0.0.1:8080/swagger-ui.html;
    }
    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080/swagger-ui/;
    }

    # Frontend React (SPA) - tout le reste tombe sur index.html
    location / {
        try_files $uri /index.html;
    }
}
